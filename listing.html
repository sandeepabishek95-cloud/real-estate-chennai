<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Details</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="style.css">

<!-- Leaflet CSS & JS for Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <a href="index.html" class="back-btn">⬅ Back</a>
  <a href="https://wa.me/917010022388" class="wa-btn">💬 WhatsApp</a>
</nav>

<!-- Property Details -->
<div class="property-details">
  <h1 id="prop-title"></h1>
  <img id="prop-img" src="" alt="Property Image">

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn" onclick="openTab('info')">Info</button>
    <button class="tab-btn" onclick="openTab('map')">Map</button>
  </div>

  <!-- Tab Contents -->
  <div id="info" class="tab-content">
    <p id="prop-location"></p>
    <p id="prop-area"></p>
    <p id="prop-price"></p>
  </div>

  <div id="map" class="tab-content">
    <div id="map-container"></div>
  </div>
</div>

<footer>© Chennai Real Estate</footer>

<script>
// Property data
const properties = {
  1: { title: "Adyar House", img: "assets/property1.jpg", location: "Adyar, Chennai", area: "1200 sq.ft", price: "₹1.5 Cr", lat: 13.0103, lng: 80.2495 },
  2: { title: "Velachery Land", img: "assets/property2.jpg", location: "Velachery, Chennai", area: "2000 sq.ft", price: "₹2.1 Cr", lat: 12.9932, lng: 80.2300 },
  3: { title: "T. Nagar Apartment", img: "assets/property3.jpg", location: "T. Nagar, Chennai", area: "950 sq.ft", price: "₹1.2 Cr", lat: 13.0411, lng: 80.2337 },
  4: { title: "Anna Nagar Villa", img: "assets/property4.jpg", location: "Anna Nagar, Chennai", area: "1800 sq.ft", price: "₹2.8 Cr", lat: 13.0878, lng: 80.2110 },
  5: { title: "Besant Nagar Beach House", img: "assets/property5.jpg", location: "Besant Nagar, Chennai", area: "2200 sq.ft", price: "₹3.5 Cr", lat: 13.0090, lng: 80.2717 }
};

// Load property info dynamically
const params = new URLSearchParams(window.location.search);
const propId = params.get("prop");
if (propId && properties[propId]) {
  const prop = properties[propId];
  document.getElementById("prop-title").innerText = prop.title;
  document.getElementById("prop-img").src = prop.img;
  document.getElementById("prop-location").innerText = "Location: " + prop.location;
  document.getElementById("prop-area").innerText = "Area: " + prop.area;
  document.getElementById("prop-price").innerText = "Price: " + prop.price;

  // Initialize Leaflet map
  const mapDiv = document.getElementById("map-container");
  if (mapDiv) {
    const map = L.map('map-container').setView([prop.lat, prop.lng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);
    L.marker([prop.lat, prop.lng]).addTo(map)
      .bindPopup(prop.title)
      .openPopup();
  }
}

// Tabs function
function openTab(tabName) {
  const tabs = document.querySelectorAll(".tab-content");
  tabs.forEach(t => t.style.display = "none");
  document.getElementById(tabName).style.display = "block";
}

// Show info tab by default
window.onload = () => openTab('info');
</script>

</body>
</html>
