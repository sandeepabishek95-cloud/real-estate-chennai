<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chennai Real Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">
    <img src="assets/logo.png" alt="Logo">
    <span>Chennai Real Estate</span>
  </div>
  <div class="nav-actions">
    <a href="https://wa.me/917010022388" class="wa-btn">💬 WhatsApp</a>
  </div>
</nav>

<header class="hero">
  <h1>Find Your Dream Property in Chennai</h1>
  <p>Click any listing to see details and directions</p>
</header>

<section class="listings">
  <h2>Available Properties</h2>

  <div class="cards">
    <!-- Example property card -->
    <a href="listing.html?prop=1" class="card">
      <img src="assets/property1.jpg" alt="Property 1">
      <h3>Adyar House</h3>
      <p>Location: Adyar</p>
      <p>Area: 1200 sq.ft | Price: ₹1.5 Cr</p>
    </a>

    <a href="listing.html?prop=2" class="card">
      <img src="assets/property2.jpg" alt="Property 2">
      <h3>Velachery Land</h3>
      <p>Location: Velachery</p>
      <p>Area: 2000 sq.ft | Price: ₹2.1 Cr</p>
    </a>

    <!-- Add more cards here -->
  </div>
</section>

<footer>© Chennai Real Estate</footer>
<script src="script.js"></script>
</body>
</html>
